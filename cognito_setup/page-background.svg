<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="600" fill="#1c1917"/>
  <defs>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#3a3532"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.7"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect width="900" height="600" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="900" height="600" fill="url(#dots)" mask="url(#fadeMask)"/>
</svg>

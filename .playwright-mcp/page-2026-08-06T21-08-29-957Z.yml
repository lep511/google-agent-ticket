      - list [ref=f3e592]:
        - listitem [ref=f3e593]:
          - paragraph [ref=f3e598]:
            - strong [ref=f3e599]: Q2 Earnings Miss Sparks Selloff
            - text: ": Tesla reported Q2 revenue of $28.24 billion (+25.6% Y/Y) and record deliveries of 480,126 units, but adjusted EPS of $0.33 missed Wall Street estimates of ~$0.51, sending shares down 26% in July 2026."
        - listitem [ref=f3e600]:
          - paragraph [ref=f3e605]:
            - strong [ref=f3e606]: Heavy AI & Robotics Capex Drags Cash Flow
            - text: ": Free cash flow flipped to negative $1.09 billion as capital expenditures spiked 141% Y/Y to $5.79 billion; management guided full-year 2026 capex to top $25 billion for real-world AI, compute, and factory expansions."
        - listitem [ref=f3e607]:
          - paragraph [ref=f3e612]:
            - strong [ref=f3e613]: Analyst Price Target Trim Wave
            - text: ": Following earnings, major research firms including Piper Sandler ($500 to $450), Stifel ($508 to $491), and Mizuho ($460 to $450) cut 12-month price targets citing gross margin compression and elevated capital intensity, though most maintained 'Buy' or 'Overweight' ratings."
        - listitem [ref=f3e614]:
          - paragraph [ref=f3e619]:
            - strong [ref=f3e620]: China Wholesale Resurgence vs. Domestic Pressure
            - text: ": Gigafactory Shanghai recorded 93,579 wholesale shipments in July 2026 (+37.85% Y/Y), driven primarily by export markets, while domestic rival BYD posted record monthly sales of 419,211 units."
        - listitem [ref=f3e621]:
          - paragraph [ref=f3e626]:
            - strong [ref=f3e627]: Autonomous Expansion Facing Regulatory Eyes
            - text: ": Tesla commenced Cybercab production at Giga Texas and launched FSD (Supervised) in Europe (Amsterdam), but US regulators (NHTSA) opened a preliminary probe covering ~1.2 million Model 3 and Y vehicles over potential suspension failures."
    - generic [ref=f3e628]:
      - generic [ref=f3e629]:
        - heading "Company Announcements & Q2 2026 Financial Results" [level=3] [ref=f3e630]
        - generic [ref=f3e632]:
          - paragraph [ref=f3e633]:
            - text: Tesla released its Q2 2026 financial update on July 22, 2026, delivering mixed fundamental signals. Total revenue surged 25.6% year-over-year to
            - strong [ref=f3e634]: $28.24 billion
            - text: ", topping consensus estimates of $25.71 billion and pushing trailing twelve-month revenue above"
            - strong [ref=f3e635]: $100 billion
            - text: for the first time. The top-line expansion was driven by record quarterly vehicle deliveries of
            - strong [ref=f3e636]: 480,126 units
            - text: (against 450,000+ vehicles produced) and
            - strong [ref=f3e637]: 13.5 GWh
            - text: in energy storage deployments.
          - paragraph [ref=f3e638]:
            - text: However, profitability severely deteriorated under price cuts and elevated operating expenses ($4.35 billion, up 47% Y/Y). Non-GAAP EPS came in at
            - strong [ref=f3e639]: $0.33
            - text: ", falling 35% short of the $0.51 consensus estimate. Operating margin collapsed to"
            - strong [ref=f3e640]: 1.4%
            - text: ", while gross margin contracted to 16.8% (down from 21.1% in Q1 2026), affected by lower average selling prices, tariff changes, and a $240 million energy warranty adjustment. Capital expenditures jumped 141% Y/Y to"
            - strong [ref=f3e641]: $5.79 billion
            - text: ", turning free cash flow to negative"
            - strong [ref=f3e642]: $1.09 billion
            - text: . Management reiterated that capex will exceed
            - strong [ref=f3e643]: $25 billion
            - text: in 2026 as Tesla scales AI compute, completes Megafactory Texas, builds Cybercab lines at Giga Texas, and constructs Optimus production capacity at the Fremont facility.
